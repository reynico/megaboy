name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GBDK_URL: https://github.com/gbdk-2020/gbdk-2020/releases/download/4.5.0/gbdk-linux64.tar.gz
  # Hash of the release asset as downloaded on 2026-11-17; GBDK publishes no checksums.
  GBDK_SHA256: d7857a5f6d135ee4c249043ca26aad9f2ec8ab5d4106d97720d404114f42605c
  ARM_TC: arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi
  ARM_URL: https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel
  ARM_SHA256: 62a63b981fe391a9cbad7ef51b17e49aeaa3e7b0d029b36ca1e9c3b2a9b78823
  PICO_SDK_COMMIT: bddd20f928ce76142793bef434d4f75f4af6e433
  PICOTOOL_COMMIT: de8ae5ac334e1126993f72a5c67949712fd1e1a4
  ARDUINO_CLI_URL: https://github.com/arduino/arduino-cli/releases/download/v1.5.1/arduino-cli_1.5.1_Linux_64bit.tar.gz
  ARDUINO_CLI_SHA256: 28a8e119c498a25607821c36cb2dc49e8463941b261a0d99091baa7bc692dd2b
  ARDUINO_AVR: arduino:avr@1.8.6

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Common tests
        run: make -C common test SAN=address,undefined
      - name: GBC tests
        run: make -C gbc test SAN=address,undefined
      - name: Bridge tests
        run: make -C bridge/test test SAN=address,undefined
      - name: Python syntax
        run: python3 -m py_compile tools/*.py

  gbc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GBDK
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gbdk.tar.gz" "$GBDK_URL"
          echo "$GBDK_SHA256  $RUNNER_TEMP/gbdk.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gbdk.tar.gz" -C "$RUNNER_TEMP"
      - name: Build ROM
        env:
          MB_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: make -C gbc GBDK_HOME="$RUNNER_TEMP/gbdk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gbc-rom
          path: gbc/build/megaboy.gbc
          if-no-files-found: error

  pico:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Arm toolchain
        run: |
          curl -fsSL -o "$RUNNER_TEMP/$ARM_TC.tar.xz" "$ARM_URL/$ARM_TC.tar.xz"
          echo "$ARM_SHA256  $RUNNER_TEMP/$ARM_TC.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$ARM_TC.tar.xz" -C "$RUNNER_TEMP"
          echo "PICO_TOOLCHAIN_PATH=$RUNNER_TEMP/$ARM_TC" >> "$GITHUB_ENV"
      - name: Fetch pico-sdk
        run: |
          sdk="$RUNNER_TEMP/pico-sdk"
          git init -q "$sdk"
          git -C "$sdk" fetch -q --depth 1 https://github.com/raspberrypi/pico-sdk "$PICO_SDK_COMMIT"
          git -C "$sdk" checkout -q FETCH_HEAD
          git -C "$sdk" submodule update -q --init lib/tinyusb
          echo "PICO_SDK_PATH=$sdk" >> "$GITHUB_ENV"
      - name: Build picotool
        run: |
          src="$RUNNER_TEMP/picotool-src"
          git init -q "$src"
          git -C "$src" fetch -q --depth 1 https://github.com/raspberrypi/picotool "$PICOTOOL_COMMIT"
          git -C "$src" checkout -q FETCH_HEAD
          cmake -S "$src" -B "$RUNNER_TEMP/picotool-build" -DPICOTOOL_NO_LIBUSB=1 \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/picotool"
          cmake --build "$RUNNER_TEMP/picotool-build" -j
          cmake --install "$RUNNER_TEMP/picotool-build"
          cfg=$(find "$RUNNER_TEMP/picotool" -name picotoolConfig.cmake | head -n 1)
          test -n "$cfg"
          echo "PICOTOOL_CMAKE_DIR=$(dirname "$cfg")" >> "$GITHUB_ENV"
      - name: Build firmware
        run: |
          cmake -S bridge -B bridge/build -Dpicotool_DIR="$PICOTOOL_CMAKE_DIR"
          if [ -d bridge/build/_deps/picotool-src ]; then echo "error: sdk fetched an unpinned picotool"; exit 1; fi
          cmake --build bridge/build -j
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pico-uf2
          path: bridge/build/bridge.uf2
          if-no-files-found: error

  nano:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install arduino-cli
        run: |
          curl -fsSL -o "$RUNNER_TEMP/arduino-cli.tar.gz" "$ARDUINO_CLI_URL"
          echo "$ARDUINO_CLI_SHA256  $RUNNER_TEMP/arduino-cli.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/arduino-cli"
          tar -xzf "$RUNNER_TEMP/arduino-cli.tar.gz" -C "$RUNNER_TEMP/arduino-cli"
          echo "$RUNNER_TEMP/arduino-cli" >> "$GITHUB_PATH"
      - name: Install AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install "$ARDUINO_AVR"
      - name: Build sketch
        run: arduino-cli compile --fqbn arduino:avr:nano --library "$GITHUB_WORKSPACE/common" nano/megaboy_nano
