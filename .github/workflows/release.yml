name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  screens:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gbc-rom
          path: gbc/build
      - name: Install PyBoy
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q --require-hashes --only-binary :all: -r tools/screens.txt
      - name: Capture screens
        working-directory: tools
        run: |
          "$RUNNER_TEMP/venv/bin/python" -I screenshots.py --sheet --out "$RUNNER_TEMP/screens/screens.png"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screens
          path: ${{ runner.temp }}/screens/screens.png
          if-no-files-found: error

  release:
    needs: [build, screens]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum megaboy.gbc bridge.uf2 > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/screens.png"
          printf 'GBC ROM and Pico firmware for %s.\n\n![screens](%s)\n' "$TAG" "$url" > notes.md
          gh release create "$TAG" dist/megaboy.gbc dist/bridge.uf2 dist/SHA256SUMS dist/screens.png \
            --verify-tag --title "$TAG" --notes-file notes.md
